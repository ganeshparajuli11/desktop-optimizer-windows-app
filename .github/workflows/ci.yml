name: CI Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Validate syntax
        run: |
          .\.venv\Scripts\python -m py_compile sysctl.py setup.py

      - name: Validate NVML package selection
        run: |
          .\.venv\Scripts\python -c "import importlib.metadata as md; names={dist.metadata['Name'].lower() for dist in md.distributions()}; assert 'nvidia-ml-py' in names, 'nvidia-ml-py is missing'; assert 'pynvml' not in names, 'deprecated pynvml package installed'; print('NVML dependency check passed')"
